# Opens the app and waits for the home screen.
# - Dev build (default): through the dev client, on the local Metro server.
# - Release build (no Metro, live API): maestro test -e RELEASE=true .maestro
appId: com.dondeta.app
---
- stopApp
- runFlow:
    when:
      true: ${RELEASE == 'true'}
    commands:
      - launchApp
- runFlow:
    when:
      true: ${RELEASE != 'true'}
    commands:
      - openLink: "exp+dondeta://expo-development-client/?url=http%3A%2F%2Flocalhost%3A8081"
- extendedWaitUntil:
    visible: "Comparaciones del día"
    timeout: 90000
- runFlow:
    when:
      visible: "Continue"
    commands:
      - tapOn: "Continue"
