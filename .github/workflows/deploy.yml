# Continuous deployment: every push to main is verified and, if green,
# deployed to all DóndeTa stacks (dondeta.com.do, .co, .mx) on 163.245.207.38.
# The server side is deploy/cd/dondeta-deploy.sh, which health-checks each
# stack and rolls it back on its own if the new version doesn't come up.
#
# Manual runs (Actions -> Deploy -> Run workflow) also expose status,
# rollback and merge-products without touching the server.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      action:
        description: "deploy | status | rollback | merge-products"
        required: true
        default: deploy
        type: choice
        options: [deploy, status, rollback, merge-products]
      stack:
        description: "Stack (rollback / merge-products)"
        required: false
        default: dondeta
        type: choice
        options: [dondeta, dondeta-co, dondeta-mx]
      apply:
        description: "merge-products: write changes (otherwise dry run)"
        required: false
        default: false
        type: boolean

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, test, build
    if: github.event_name == 'push' || inputs.action == 'deploy'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.3
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Web app (typecheck + unit tests + build)
        run: pnpm install --frozen-lockfile && pnpm check
      - name: API typecheck
        working-directory: apps/api
        run: pnpm install --frozen-lockfile && pnpm typecheck
      - name: SEO site typecheck
        working-directory: apps/web-seo
        run: pnpm install --frozen-lockfile && pnpm typecheck

  deploy:
    name: Deploy to production
    needs: verify
    if: github.event_name == 'push' || inputs.action == 'deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: SSH key
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          cp deploy/cd/known_hosts ~/.ssh/known_hosts
      - name: Deploy (auto-rollback per stack on failed health check)
        run: |
          # Without pipefail the step takes tee's exit code: a failed ssh
          # (server unreachable, deploy error) still showed up as success.
          set -o pipefail
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes -o ServerAliveInterval=30 -p 1600 \
            ubuntu@163.245.207.38 "deploy ${GITHUB_SHA}" | tee status.json
      - name: Summary
        if: always()
        run: |
          {
            echo "### Deploy \`${GITHUB_SHA:0:7}\`"
            echo '```json'
            cat status.json 2>/dev/null || echo '(no status)'
            echo '```'
            echo "- https://dondeta.com.do"
          } >> "$GITHUB_STEP_SUMMARY"

  manual:
    name: ${{ inputs.action }}
    if: github.event_name == 'workflow_dispatch' && inputs.action != 'deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: SSH key
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          cp deploy/cd/known_hosts ~/.ssh/known_hosts
      - name: Run
        env:
          ACTION: ${{ inputs.action }}
          STACK: ${{ inputs.stack }}
          APPLY: ${{ inputs.apply }}
        run: |
          case "$ACTION" in
            status) CMD="status" ;;
            rollback) CMD="rollback $STACK" ;;
            merge-products) CMD="merge-products $STACK $([ "$APPLY" = "true" ] && echo apply)" ;;
          esac
          set -o pipefail
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes -o ServerAliveInterval=30 -p 1600 \
            ubuntu@163.245.207.38 "$CMD" | tee output.txt
          { echo "### $CMD"; echo '```'; cat output.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
