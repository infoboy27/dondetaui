name: MVP CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'apps/api/**'
      - 'deploy/**'
      - 'Dockerfile.web'
      - 'docker-compose.yml'
      - '.github/workflows/mvp-ci.yml'
  push:
    branches: [main, 'agent/**']
    paths:
      - 'apps/mobile/**'
      - 'apps/api/**'
      - 'deploy/**'
      - 'Dockerfile.web'
      - 'docker-compose.yml'
      - '.github/workflows/mvp-ci.yml'

permissions:
  contents: read

jobs:
  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
      - name: Install mobile dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Typecheck mobile MVP
        run: pnpm check

  compose:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-password
      WEB_PORT: 8080
      LOAD_DEV_SEED: 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Validate Docker Compose
        run: docker compose config >/tmp/dondeta-compose.yml
      - name: Build web image
        run: docker build -f Dockerfile.web -t dondeta-web:ci .
      - name: Start complete MVP stack
        run: docker compose up -d --build
      - name: Wait for web and API
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/healthz >/dev/null && \
               curl -fsS http://127.0.0.1:8080/api/health | jq -e '.status == "ok" and .database == "ok"' >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs --no-color
          exit 1
      - name: Smoke test browser-facing API
        run: |
          curl -fsS http://127.0.0.1:8080/healthz | grep -q ok
          curl -fsS http://127.0.0.1:8080/api/health | jq -e '.status == "ok" and .database == "ok"'
          curl -fsS http://127.0.0.1:8080/api/products | jq -e 'length >= 2'
      - name: Show stack status
        if: always()
        run: docker compose ps
      - name: Stop stack
        if: always()
        run: docker compose down -v
