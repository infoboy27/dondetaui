services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dondeta}
      POSTGRES_USER: ${POSTGRES_USER:-dondeta}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - dondeta_postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dondeta} -d ${POSTGRES_DB:-dondeta}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  migrate:
    image: postgres:18-alpine
    restart: "no"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-dondeta}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:-dondeta}
      LOAD_DEV_SEED: ${LOAD_DEV_SEED:-true}
    volumes:
      - ./apps/api/migrations:/migrations:ro
      - ./deploy/migrate.sh:/deploy/migrate.sh:ro
    entrypoint: ["/bin/sh", "/deploy/migrate.sh"]
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - dondeta_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./apps/api
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-dondeta}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:-dondeta}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
      REDIS_URL: redis://redis:6379
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
    ports:
      - "127.0.0.1:${API_PORT:-3001}:3001"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3001/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        VITE_USE_API: "true"
        VITE_API_BASE_URL: /api
        VITE_ADSENSE_CLIENT_ID: ${VITE_ADSENSE_CLIENT_ID:-}
        VITE_ADSENSE_SLOT_LEADERBOARD: ${VITE_ADSENSE_SLOT_LEADERBOARD:-}
        VITE_ADSENSE_SLOT_MEDIUM_RECTANGLE: ${VITE_ADSENSE_SLOT_MEDIUM_RECTANGLE:-}
        VITE_ADSENSE_SLOT_MOBILE_BANNER: ${VITE_ADSENSE_SLOT_MOBILE_BANNER:-}
    restart: unless-stopped
    networks:
      - default
      - proxy
    # Host port publish, used by reverse proxies that route via
    # host.docker.internal:PORT from a file-based config instead of
    # discovering the `proxy` network's Traefik labels above (e.g. a shared
    # Traefik whose Docker provider only watches an unrelated network).
    # Defaults to loopback-only; a shared Traefik reaches the host through
    # the Docker bridge gateway, not 127.0.0.1, so hosts using that pattern
    # need WEB_BIND_ADDRESS=0.0.0.0 in their .env.
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-8080}:80"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.dondeta.rule=Host(`dondeta.jfmcss.com`)"
      - "traefik.http.routers.dondeta.entrypoints=websecure"
      - "traefik.http.routers.dondeta.tls=true"
      - "traefik.http.routers.dondeta.tls.certresolver=cloudflare"
      - "traefik.http.routers.dondeta.middlewares=secure-headers@file"
      - "traefik.http.services.dondeta.loadbalancer.server.port=80"
    depends_on:
      api:
        condition: service_healthy
      web-seo:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  # Server-renders /product/:slug, /sitemap.xml, /robots.txt for search
  # engines -- slice 1 of the Next.js migration docs/ARCHITECTURE.md targets.
  # Not exposed to Traefik directly: the `web` service's nginx proxies just
  # those paths here (see deploy/nginx.conf), everything else stays on the
  # existing Vite SPA.
  web-seo:
    build:
      context: ./apps/web-seo
    restart: unless-stopped
    environment:
      PORT: 3002
      HOSTNAME: "0.0.0.0"
      API_BASE_URL: http://api:3001/api
      SITE_URL: ${SITE_URL:-https://dondeta.jfmcss.com}
      GA_MEASUREMENT_ID: ${GA_MEASUREMENT_ID:-}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3002/robots.txt >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s

  ingestion-worker:
    profiles: ["ingestion"]
    build:
      context: ./apps/api
      dockerfile: Dockerfile.ingestion
    restart: unless-stopped
    working_dir: /app
    # Playwright's bundled Chromium needs real deps (mem, /dev/shm) beyond node:22-alpine.
    shm_size: "1gb"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-dondeta}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:-dondeta}
      INGESTION_INTERVAL_SECONDS: ${INGESTION_INTERVAL_SECONDS:-21600}
      PLAZA_LAMA_MAX_CATEGORY_PAGES: ${PLAZA_LAMA_MAX_CATEGORY_PAGES:-30}
      PLAZA_LAMA_MAX_PRODUCTS: ${PLAZA_LAMA_MAX_PRODUCTS:-500}
      PLAZA_LAMA_DISCOVERY_DELAY_MS: ${PLAZA_LAMA_DISCOVERY_DELAY_MS:-500}
      PLAZA_LAMA_PRODUCT_DELAY_MS: ${PLAZA_LAMA_PRODUCT_DELAY_MS:-350}
      JUMBO_MAX_PAGES: ${JUMBO_MAX_PAGES:-30}
      JUMBO_MAX_PRODUCTS: ${JUMBO_MAX_PRODUCTS:-500}
      SIRENA_MAX_PAGES: ${SIRENA_MAX_PAGES:-30}
      SIRENA_MAX_PRODUCTS: ${SIRENA_MAX_PRODUCTS:-500}
      CORRIPIO_MAX_PAGES: ${CORRIPIO_MAX_PAGES:-30}
      CORRIPIO_MAX_PRODUCTS: ${CORRIPIO_MAX_PRODUCTS:-500}
      PRICESMART_MAX_PAGES: ${PRICESMART_MAX_PAGES:-20}
      PRICESMART_MAX_PRODUCTS: ${PRICESMART_MAX_PRODUCTS:-300}
    volumes:
      - ./deploy/ingestion-loop.sh:/deploy/ingestion-loop.sh:ro
    entrypoint: ["/bin/sh", "/deploy/ingestion-loop.sh"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  alerts-worker:
    profiles: ["alerts"]
    build:
      context: ./apps/api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-dondeta}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:-dondeta}
      ALERTS_INTERVAL_SECONDS: ${ALERTS_INTERVAL_SECONDS:-1800}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-}
      TWILIO_WHATSAPP_FROM: ${TWILIO_WHATSAPP_FROM:-}
    volumes:
      - ./deploy/alerts-loop.sh:/deploy/alerts-loop.sh:ro
    entrypoint: ["/bin/sh", "/deploy/alerts-loop.sh"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  backup:
    profiles: ["backup"]
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-dondeta}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:-dondeta}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - ./deploy/backup.sh:/deploy/backup.sh:ro
      - dondeta_backups:/backups
    entrypoint: ["/bin/sh", "/deploy/backup.sh"]
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  dondeta_postgres:
  dondeta_redis:
  dondeta_backups:

networks:
  default:
  proxy:
    external: true
