server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 'ok';
  }

  location /api/ {
    proxy_pass http://api:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;
    proxy_read_timeout 30s;
  }

  # Server-rendered product pages + sitemap/robots for crawlers (apps/web-seo).
  # In-app client-side navigation to /product/:slug never reaches nginx at
  # all (that's the SPA's own React Router route) -- these only catch fresh
  # server requests: a crawler, a shared link, or a refresh.
  location /product/ {
    proxy_pass http://web-seo:3002;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Next.js's own static asset chunks -- needed for apps/web-seo's
  # server-rendered product pages to hydrate on a direct hit (crawler,
  # shared link, refresh; see the /product/ location above). Missing this
  # block routed these requests through the SPA's catchall (`location /`)
  # instead, which silently served index.html in place of the real JS --
  # browsers refused to execute it (wrong MIME type), so those pages loaded
  # visually correct but with zero working client-side JS. Found live via
  # /qa on 2026-08-12. Content-hashed like Vite's /assets/, safe to cache
  # forever.
  location /_next/static/ {
    proxy_pass http://web-seo:3002;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  # Privacy policy, required for the Play Console listing (apps/web-seo).
  location = /privacy {
    proxy_pass http://web-seo:3002;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /sitemap.xml {
    proxy_pass http://web-seo:3002;
    proxy_set_header Host $host;
  }

  location = /robots.txt {
    proxy_pass http://web-seo:3002;
    proxy_set_header Host $host;
  }

  # Vite's hashed filenames (index-<hash>.js) change on content change, so
  # these are safe to cache forever -- a new build always gets a new URL.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # index.html references the current asset hashes, so it must always be
  # revalidated -- letting it cache (even heuristically, with no explicit
  # header) risks serving a stale bundle reference right after a deploy.
  location = /index.html {
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
